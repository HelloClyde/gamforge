name: Validate macOS full bundles

on:
  workflow_call:
    inputs:
      app_run_id:
        description: Build run for this exact branch and source SHA (Mac jobs successful)
        type: string
        required: true
      toolchain_run_id:
        description: Toolchain run on this branch (matching Mac jobs and builder hashes)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      app_run_id:
        description: Build run for this exact branch and source SHA (Mac jobs successful)
        type: string
        required: true
      toolchain_run_id:
        description: Toolchain run on this branch (matching Mac jobs and builder hashes)
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  full:
    name: Validate full bundle (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python_architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python_architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      APP_RUN_ID: ${{ inputs.app_run_id }}
      TOOLCHAIN_RUN_ID: ${{ inputs.toolchain_run_id }}
      EXPECTED_BRANCH: ${{ github.ref_name }}
      EXPECTED_SHA: ${{ github.sha }}
      NATIVE_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_architecture }}
      - run: python -m pip install -e .
      - name: Verify run, workflow, source and native job provenance
        run: |
          python scripts/verify_full_bundle.py check-runs \
            --app-run "$APP_RUN_ID" --toolchain-run "$TOOLCHAIN_RUN_ID" \
            --architecture "$NATIVE_ARCH" --branch "$EXPECTED_BRANCH" --sha "$EXPECTED_SHA" \
            --output build/provenance.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: HelloClyde/gamforge
          run-id: ${{ inputs.app_run_id }}
          name: macos-${{ matrix.architecture }}
          path: build/app-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: HelloClyde/gamforge
          run-id: ${{ inputs.toolchain_run_id }}
          name: s1c33-9288-toolchain-macos-${{ matrix.architecture }}
          path: build/toolchain-artifacts
      - name: Assemble authorized dependencies and test isolated conversions
        run: |
          python scripts/verify_full_bundle.py assemble \
            --architecture "$NATIVE_ARCH" --provenance build/provenance.json \
            --app-artifacts build/app-artifacts --toolchain-artifacts build/toolchain-artifacts \
            --work-dir "$RUNNER_TEMP/gamforge-full-validation" --output-dir dist/full-validation
      - name: Upload verified packages only (no Release publication)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gamforge-full-macos-${{ matrix.architecture }}
          path: |
            dist/full-validation/*.zip
            dist/full-validation/*.zip.sha256
            dist/full-validation/validation-*.json
          if-no-files-found: error
          retention-days: 14
