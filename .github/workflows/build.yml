name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      app_run_id:
        description: Optional existing app run ID; supply with toolchain_run_id for full Mac validation only
        type: string
        required: false
        default: ''
      toolchain_run_id:
        description: Optional existing toolchain run ID; supply with app_run_id for full Mac validation only
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}${{ inputs.app_run_id != '' && '-full-validation' || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate-full-inputs:
    name: Reject incomplete full-validation inputs
    if: ${{ github.event_name == 'workflow_dispatch' && ((inputs.app_run_id == '' && inputs.toolchain_run_id != '') || (inputs.app_run_id != '' && inputs.toolchain_run_id == '')) }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Supply both app_run_id and toolchain_run_id, or leave both empty.'
          exit 1

  full-macos:
    name: Validate existing native Mac artifacts
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.app_run_id != '' && inputs.toolchain_run_id != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/macos-full.yml
    with:
      app_run_id: ${{ inputs.app_run_id }}
      toolchain_run_id: ${{ inputs.toolchain_run_id }}

  test:
    name: Python and native runtime tests
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.app_run_id == '' && inputs.toolchain_run_id == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python scripts/audit_repository.py
      - run: python -m pytest --junitxml=build/test-results.xml
      - run: python -m a9288 --self-test
      - name: Validate tag metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: build/test-results.xml
          if-no-files-found: warn

  windows:
    name: Windows portable application
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Expose native MinGW GCC to Python
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $gcc = Get-Item "$env:MSYS2_LOCATION\ucrt64\bin\gcc.exe" -ErrorAction SilentlyContinue
          if (!$gcc) { throw 'MSYS2 UCRT64 gcc was not installed at the runner temp path' }
          $gcc.DirectoryName >> $env:GITHUB_PATH
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=build/windows-test-results.xml
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            dist/gamforge-*-windows-x64.zip
            dist/gamforge-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  toolchain:
    name: Native toolchains for full packages
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/toolchain.yml

  macos:
    name: macOS portable application (${{ matrix.architecture }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python-architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python-architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}
          cache: pip
      - name: Verify native host and Tk window support
        run: |
          set -euo pipefail
          xcrun --find clang
          python - <<'PY'
          import os
          import platform
          import tkinter as tk
          assert platform.system() == 'Darwin'
          assert platform.machine() == os.environ['EXPECTED_ARCHITECTURE']
          window = tk.Tk()
          window.withdraw()
          tk.Label(window, text='GAMForge · 原生转换').pack()
          window.update()
          print(platform.platform(), 'Tcl', window.tk.call('info', 'patchlevel'),
                'Tk', window.tk.call('package', 'require', 'Tk'))
          window.destroy()
          PY
      - name: Collect notices for the actual Tcl and Tk runtime versions
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import tkinter as tk
          from urllib.request import urlopen

          window = tk.Tk()
          window.withdraw()
          versions = {
              'tcl': str(window.tk.call('info', 'patchlevel')),
              'tk': str(window.tk.call('package', 'require', 'Tk')),
          }
          window.destroy()
          destination = Path('build/license-input')
          destination.mkdir(parents=True, exist_ok=True)
          manifest = {'schema': 1}
          for component, version in versions.items():
              if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                  raise RuntimeError(f'Unsupported {component} release tag: {version}')
              tag = 'core-' + version.replace('.', '-')
              url = f'https://raw.githubusercontent.com/tcltk/{component}/{tag}/license.terms'
              with urlopen(url, timeout=30) as response:
                  data = response.read(131073)
              if not data or len(data) > 131072 or 'copyright' not in data.decode('utf-8').lower():
                  raise RuntimeError(f'Unexpected license text: {url}')
              filename = component + '-license.terms'
              (destination / filename).write_bytes(data)
              manifest[component] = {
                  'version': version, 'source_url': url, 'path': filename,
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          (destination / 'TCLTK-NOTICES.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=build/macos-test-results.xml
      - name: Build native app, helper and CLI; run frozen self-tests
        run: |
          python scripts/build_macos.py \
            --architecture "$EXPECTED_ARCHITECTURE" \
            --minimum-macos 11.0 \
            --tk-notices-manifest build/license-input/TCLTK-NOTICES.json \
            --dist-dir "dist/mac-$EXPECTED_ARCHITECTURE" \
            --work-dir "build/pyinstaller-$EXPECTED_ARCHITECTURE"
      - name: Test frozen GUI window and icon preview
        env:
          A9288_USER_DATA: ${{ runner.temp }}/gamforge-gui-smoke
        run: |
          set -euo pipefail
          package_dir="dist/mac-$EXPECTED_ARCHITECTURE"
          (cd "$package_dir" && shasum -a 256 --check *.zip.sha256)
          archive=("$package_dir"/*.zip)
          test "${#archive[@]}" -eq 1
          extracted="$RUNNER_TEMP/gamforge-macos-$EXPECTED_ARCHITECTURE"
          ditto -x -k "${archive[0]}" "$extracted"
          "$extracted/GAMForge/GAMForge-CLI" --self-test
          codesign --verify --deep --strict "$extracted/GAMForge/GAMForge.app"
          "$extracted/GAMForge/GAMForge.app/Contents/MacOS/GAMForge" --gui-smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-test-results-${{ matrix.architecture }}
          path: build/macos-test-results.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.architecture }}
          path: |
            dist/mac-${{ matrix.architecture }}/gamforge-*-macos-${{ matrix.architecture }}.zip
            dist/mac-${{ matrix.architecture }}/gamforge-*-macos-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  full:
    name: Full offline package (${{ matrix.host }})
    needs: [windows, macos, toolchain]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            host: windows-x64
            python-architecture: x64
          - runner: macos-15
            host: macos-arm64
            python-architecture: arm64
          - runner: macos-15-intel
            host: macos-x86_64
            python-architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}
      - run: python -m pip install -e .
      # These artifacts come from successful jobs of this same source/run.
      # Cross-run validation remains a separate, explicit maintenance workflow.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.host }}
          path: build/full-app-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: s1c33-9288-toolchain-${{ matrix.host }}
          path: build/full-toolchain-input
      - name: Find app-local redistributable x64 CRT (not System32)
        if: runner.os == 'Windows'
        id: crt
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio VC tools not installed' }
          $versions = Get-ChildItem -LiteralPath "$vs\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending
          $crt = $null
          foreach ($version in $versions) {
            $candidate = Get-ChildItem -Path "$($version.FullName)\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
              Where-Object { (Test-Path -LiteralPath "$($_.FullName)\msvcp140.dll") -and (Test-Path -LiteralPath "$($_.FullName)\vcruntime140.dll") -and (Test-Path -LiteralPath "$($_.FullName)\vcruntime140_1.dll") } |
              Select-Object -First 1
            if ($candidate) { $crt = $candidate; break }
          }
          if (!$crt) { throw 'Required redistributable x64 CRT DLLs were not found' }
          "directory=$($crt.FullName)" >> $env:GITHUB_OUTPUT
      - name: Assemble and validate Windows full package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VC_RUNTIME: ${{ steps.crt.outputs.directory }}
        run: |
          python scripts/build_release_full.py --host windows-x64 --authorized-redistribution --app-artifacts build/full-app-input --toolchain-artifacts build/full-toolchain-input --vc-runtime "$env:VC_RUNTIME" --work-dir "$env:RUNNER_TEMP/gamforge-full" --output-dir dist/full
      - name: Assemble and validate native Mac full package
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUNDLE_HOST: ${{ matrix.host }}
        run: |
          python scripts/build_release_full.py --host "$BUNDLE_HOST" --authorized-redistribution \
            --app-artifacts build/full-app-input --toolchain-artifacts build/full-toolchain-input \
            --work-dir "$RUNNER_TEMP/gamforge-full" --output-dir dist/full
      - name: Keep synthetic conversion failure logs (never game data)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-validation-logs-${{ matrix.host }}
          path: ${{ runner.temp }}/gamforge-full/isolated-conversion/**/conversion.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload only fully validated offline packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gamforge-full-${{ matrix.host }}
          path: |
            dist/full/gamforge-*-full-${{ matrix.host }}.zip
            dist/full/gamforge-*-full-${{ matrix.host }}.zip.sha256
            dist/full/validation-${{ matrix.host }}.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish full-only tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: full
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gamforge-full-*
          merge-multiple: true
          path: dist
      - name: Require all three full packages and matching conversion evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/check_full_release.py dist "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
      - name: Publish verified build without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          (cd dist && sha256sum --check *.sha256)
          gh release create "$RELEASE_TAG" dist/*-full-*.zip dist/*-full-*.zip.sha256 dist/validation-*.json \
            --verify-tag --draft --title "GAMForge · GAM 原生重编译器 $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
