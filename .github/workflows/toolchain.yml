name: Build S1C33 toolchain
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  toolchain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            host: windows-x64
            bootstrap_sha256: 1fadbcd48be8a5c817fb5a0de3cca2119a29f89bd755483195b98d8ec6e98b8d
          - os: macos-15
            host: macos-arm64
            bootstrap_sha256: 5bf2416fd5514c60c8d054574008819e6a3df34ab1981cef7f16fd5ed269cb22
          - os: macos-15-intel
            host: macos-x86_64
            bootstrap_sha256: 06a17c8d2b6da8bfc77d4ab04170e0617cae1c2c2c451007768eb46d1337bfa0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e . ninja 'cmake>=3.20,<4'
      - name: Reuse pinned native tools (hashes and executable probes are still checked)
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/s1c33-9288-toolchain-${{ matrix.host }}
          key: s1c33-${{ matrix.os }}-${{ matrix.host }}-min11-v1-${{ hashFiles('toolchain/manifest.json', 'toolchain/*.patch', 'scripts/build_toolchain.py') }}
      # Successful v1.5.2 tag run at bc2368a99ba77cd2081199bffad32913bb7ece80.
      # Expired/unavailable artifacts fall back to source builds. Payloads are
      # SHA-pinned below and MUST match the current builder/ABI/header manifest.
      - name: Download pinned tools when the Actions cache has expired
        if: steps.cache.outputs.cache-hit != 'true'
        id: bootstrap
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: s1c33-9288-toolchain-${{ matrix.host }}
          path: build/toolchain-bootstrap
          github-token: ${{ github.token }}
          run-id: 39085910929
      - name: Verify pinned bootstrap before any imported executable runs
        if: steps.bootstrap.outcome == 'success'
        run: python scripts/restore_toolchain_cache.py --host '${{ matrix.host }}' --sha256 '${{ matrix.bootstrap_sha256 }}' --artifacts build/toolchain-bootstrap --output-dir dist
      - name: Build with the runner's MSVC x64 environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python scripts/build_toolchain.py --jobs 2 --expect-host windows-x64 --reuse
      - name: Build native macOS compiler with AppleClang
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/build_toolchain.py --jobs 2 --expect-host '${{ matrix.host }}' --deployment-target 11.0 --reuse
      - name: Verify extracted native macOS toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          shasum -a 256 -c 's1c33-9288-toolchain-${{ matrix.host }}.zip.sha256'
          unzip -q 's1c33-9288-toolchain-${{ matrix.host }}.zip' -d "$RUNNER_TEMP/toolchain-validation"
          cd ..
          python scripts/build_toolchain.py --expect-host '${{ matrix.host }}' --verify-only "$RUNNER_TEMP/toolchain-validation/s1c33-9288-toolchain-${{ matrix.host }}"
      - name: Verify extracted Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = 'dist/s1c33-9288-toolchain-windows-x64.zip'
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'SHA256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP/toolchain-validation"
          python scripts/build_toolchain.py --expect-host windows-x64 --verify-only "$env:RUNNER_TEMP/toolchain-validation/s1c33-9288-toolchain-windows-x64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s1c33-9288-toolchain-${{ matrix.host }}
          path: |
            dist/s1c33-9288-toolchain-${{ matrix.host }}.zip
            dist/s1c33-9288-toolchain-${{ matrix.host }}.zip.sha256
          if-no-files-found: error
